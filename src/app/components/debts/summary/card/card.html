<div
  class="overflow-hidden rounded-lg px-4 py-5 bg-neutral-50 dark:bg-neutral-800 shadow-sm sm:p-6"
>
  <dt class="truncate flex items-center text-sm font-medium text-gray-500 dark:text-gray-200">
    <i [class]="icons" style="font-size: 1.5rem"></i>
    <span class="mr-2"></span>
    {{ header }}
  </dt>
  <dt class="mt-1 text-3xl font-semibold tracking-tight text-gray-900 dark:text-gray-400">
    {{ totalAmount | currency : 'USD' }}
  </dt>
</div>
