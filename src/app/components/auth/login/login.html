<div class="h-screen w-screen bg-gray-50 dark:bg-gray-900">
  <div class="flex justify-end px-12 py-12">
    <app-theme-switcher />
  </div>
  <div class="flex flex-col justify-center py-8 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
      <h2
        class="mt-6 text-center text-2xl/9 font-bold tracking-tight text-gray-900 dark:text-white"
      >
        Sign into your account
      </h2>
    </div>
    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-[480px]">
      <div
        class="bg-white px-6 py-12 shadow-sm sm:rounded-lg sm:px-12 dark:bg-gray-800/50 dark:shadow-none dark:outline dark:-outline-offset-1 dark:outline-white/10"
      >
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div>
            <div class="mt-2">
              <input
                pInputText
                type="email"
                placeholder="Email"
                formControlName="email"
                class="block w-full rounded-md !bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:!bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500"
              />
            </div>
          </div>
          <div>
            <div class="mt-2">
              <input
                pInputText
                type="password"
                placeholder="Password"
                formControlName="password"
                class="block w-full rounded-md !bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:!bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500"
              />
            </div>
          </div>
          <div>
            <button pButton type="submit" class="w-full" severity="secondary">Sign In</button>
          </div>
        </form>
        <div>
          <div class="mt-10 flex items-center gap-x-6">
            <div class="w-full flex-1 border-t border-gray-200 dark:border-white/10"></div>
            <p class="text-md/6 font-medium text-nowrap text-gray-900 dark:text-white">
              Or continue with
            </p>
            <div class="w-full flex-1 border-t border-gray-200 dark:border-white/10"></div>
          </div>
          <div class="mt-6 flex justify-center">
            <button pButton class="w-full" severity="secondary" (click)="googleLogin()">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="h-5 w-5">
                <path
                  d="M12.0003 4.75C13.7703 4.75 15.3553 5.36002 16.6053 6.54998L20.0303 3.125C17.9502 1.19 15.2353 0 12.0003 0C7.31028 0 3.25527 2.69 1.28027 6.60998L5.27028 9.70498C6.21525 6.86002 8.87028 4.75 12.0003 4.75Z"
                  fill="#EA4335"
                />
                <path
                  d="M23.49 12.275C23.49 11.49 23.415 10.73 23.3 10H12V14.51H18.47C18.18 15.99 17.34 17.25 16.08 18.1L19.945 21.1C22.2 19.01 23.49 15.92 23.49 12.275Z"
                  fill="#4285F4"
                />
                <path
                  d="M5.26498 14.2949C5.02498 13.5699 4.88501 12.7999 4.88501 11.9999C4.88501 11.1999 5.01998 10.4299 5.26498 9.7049L1.275 6.60986C0.46 8.22986 0 10.0599 0 11.9999C0 13.9399 0.46 15.7699 1.28 17.3899L5.26498 14.2949Z"
                  fill="#FBBC05"
                />
                <path
                  d="M12.0004 24.0001C15.2404 24.0001 17.9654 22.935 19.9454 21.095L16.0804 18.095C15.0054 18.82 13.6204 19.245 12.0004 19.245C8.8704 19.245 6.21537 17.135 5.2654 14.29L1.27539 17.385C3.25539 21.31 7.3104 24.0001 12.0004 24.0001Z"
                  fill="#34A853"
                />
              </svg>
              <span class="text-sm/6 font-semibold">Google</span>
            </button>
          </div>
        </div>
      </div>
      <p class="mt-4 text-center text-gray-500 dark:text-gray-400 text-sm/6">
        Don't have an account? <p-button variant="text" severity="secondary" class="ml-2" (click)="showRegister()">Create one here</p-button>
      </p>
    </div>
  </div>
</div>
